<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mundo — prototipo</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2d5b23; }
  #lienzo { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: pointer; }

  #ui { position: fixed; inset: 0; pointer-events: none; font: 600 14px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #fff; }
  .borde {
    position: absolute; pointer-events: auto; border: 0; cursor: pointer;
    width: 56px; height: 56px; border-radius: 16px;
    background: rgba(32, 22, 60, .42); color: #fff; font-size: 26px; line-height: 1;
    display: grid; place-items: center; backdrop-filter: blur(6px);
    box-shadow: 0 6px 18px rgba(0,0,0,.25), inset 0 0 0 2px rgba(255,255,255,.35);
    transition: transform .12s ease, background .12s ease, opacity .18s ease;
  }
  .borde:hover { background: rgba(60, 134, 240, .7); transform: scale(1.06); }
  .borde:active { transform: scale(.94); }
  .borde[hidden] { display: none; }
  #b-arriba { top: 16px; left: 50%; transform: translateX(-50%); }
  #b-abajo  { bottom: 16px; left: 50%; transform: translateX(-50%); }
  #b-izq    { left: 16px; top: 50%; transform: translateY(-50%); }
  #b-der    { right: 16px; top: 50%; transform: translateY(-50%); }

  #titulo { position: absolute; top: 14px; left: 16px; background: rgba(32,22,60,.4); padding: 8px 12px; border-radius: 12px; backdrop-filter: blur(6px); }
  #titulo small { display: block; font-weight: 500; opacity: .85; margin-top: 2px; }
  #ayuda { position: absolute; bottom: 14px; left: 16px; background: rgba(32,22,60,.4); padding: 8px 12px; border-radius: 12px; backdrop-filter: blur(6px); max-width: 60vw; }
  #mini { position: absolute; top: 14px; right: 16px; display: grid; gap: 4px; background: rgba(32,22,60,.4); padding: 8px; border-radius: 12px; backdrop-filter: blur(6px); }
  #mini i { width: 22px; height: 16px; border-radius: 4px; background: rgba(255,255,255,.22); }
  #mini i.on { background: #ffd23f; }
  #aviso { position: fixed; inset: 0; display: grid; place-items: center; background: #2d5b23; color: #fff; font: 600 16px/1.5 system-ui; text-align: center; padding: 24px; }
  #aviso code { background: rgba(0,0,0,.3); padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="ui" aria-hidden="true">
  <div id="titulo">Mundo — prototipo<small id="sub">cargando…</small></div>
  <div id="mini" title="pantalla actual"></div>
  <div id="ayuda">Clic para caminar · Toca la cueva para entrar/salir · Flechas en los bordes para cambiar de pantalla</div>
  <button class="borde" id="b-arriba" hidden aria-label="arriba">▲</button>
  <button class="borde" id="b-abajo"  hidden aria-label="abajo">▼</button>
  <button class="borde" id="b-izq"    hidden aria-label="izquierda">◀</button>
  <button class="borde" id="b-der"    hidden aria-label="derecha">▶</button>
</div>
<div id="aviso">cargando…</div>

<!-- MOTOR (vendorizado, en ./motor/): nucleo + arte del escenario + personaje. Solo dependen de nucleo.js. -->
<script src="./motor/nucleo.js"></script>
<script src="./motor/arte-escenario.js"></script>
<script src="./motor/arte-personaje.js"></script>

<script>
/* =============================================================================
 * Mundo — prototipo (un solo archivo + el motor en ./motor/)
 * -----------------------------------------------------------------------------
 * Motor isométrico propio (vendorizado en ./motor/, ver README.md). Proyecto independiente.
 *
 * MODELO "áreas + salas" (pensado para crecer, no solo un grid):
 *   - ÁREA: un lugar continuo con su propio escenario (campo, mazmorra, pueblo).
 *     Dentro de un área te movés entre pantallas con DESPLAZAMIENTO (pan).
 *   - SALA (pantalla): tiene vecinos arriba/abajo/izq/der (misma área) y, opcional,
 *     una SALIDA/portal a otra área. El grid es solo un generador de salas.
 *   - Cambiar de área NO es pan: es un PORTAL (fundido a negro) y el personaje
 *     aparece en la sala de entrada. Se dispara con un botón en esa pantalla.
 * ========================================================================== */
(function () {
  'use strict';
  const aviso = document.getElementById('aviso');
  const FZ = window.FZ, V = FZ && FZ.visual && FZ.visual.cartoon, A = V && V.A;
  if (!V || !A || !A.guardiao || !A.arvore) {
    aviso.innerHTML = 'No se pudo cargar el motor.<br>Abrí este proyecto con un servidor local:<br><br><code>npx serve .</code><br><br>y entrá a <code>index.html</code> (el <code>file://</code> directo puede bloquear los scripts de <code>motor/</code>).';
    return;
  }
  const ease = V.ease.out;   // ¡OJO! en el motor V.ease es un OBJETO { out, inOut, ... }, no una función

  /* ============================== raster: SVG -> bitmap ============================== */
  let host = null;
  function medir(inner) {
    if (!host) { host = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); host.setAttribute('width', '10'); host.setAttribute('height', '10'); host.style.cssText = 'position:absolute;left:-9999px;top:-9999px;visibility:hidden'; document.body.appendChild(host); }
    host.innerHTML = '<g>' + inner + '</g>';
    let b; try { b = host.firstChild.getBBox(); } catch (e) { b = { x: -20, y: -40, width: 40, height: 44 }; }
    host.innerHTML = '';
    return { x: b.x, y: b.y, w: b.width, h: b.height };
  }
  const sprites = {}, bmps = {};
  function definir(nombre, construir, esc) {
    const out = construir(); esc = esc || 1;
    const svg = esc !== 1 ? `<g transform="scale(${esc})">${out.svg}</g>` : out.svg;
    const pad = (out.pad != null ? out.pad : 6) * esc;
    let bb = medir((out.defs ? '<defs>' + out.defs + '</defs>' : '') + svg);
    if (!(bb.w > 0) || !(bb.h > 0)) bb = { x: -2, y: -2, w: 4, h: 4 };
    bb = { x: Math.floor(bb.x - pad), y: Math.floor(bb.y - pad), w: Math.ceil(bb.w + pad * 2) + 1, h: Math.ceil(bb.h + pad * 2) + 1 };
    sprites[nombre] = { svg, defs: out.defs || '', bb };
  }
  function rasterizar(sp, s) {
    const W = Math.max(1, Math.round(sp.bb.w * s)), H = Math.max(1, Math.round(sp.bb.h * s));
    const texto = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="${sp.bb.x} ${sp.bb.y} ${W / s} ${H / s}">` + (sp.defs ? '<defs>' + sp.defs + '</defs>' : '') + sp.svg + '</svg>';
    return new Promise((ok) => {
      const url = URL.createObjectURL(new Blob([texto], { type: 'image/svg+xml' }));
      const img = new Image();
      img.onload = () => { const cv = document.createElement('canvas'); cv.width = W; cv.height = H; cv.getContext('2d').drawImage(img, 0, 0, W, H); URL.revokeObjectURL(url); ok(cv); };
      img.onerror = () => { URL.revokeObjectURL(url); ok(document.createElement('canvas')); };
      img.src = url;
    });
  }
  function prepararTodos(s) { return Promise.all(Object.keys(sprites).map((n) => rasterizar(sprites[n], s).then((cv) => { bmps[n] = cv; }))); }

  /* ============================== sprites (arte del motor) ============================== */
  for (let i = 0; i < 6; i++) definir('tufo' + i, () => A.tufo(i * 7 + 1));
  for (let i = 0; i < 6; i++) definir('flor' + i, () => A.flores(i * 13 + 3));
  for (let i = 0; i < 6; i++) definir('pedra' + i, () => A.pedra(i * 5 + 2, i < 3 ? 0.9 : 1.4));
  const BUSH = [['#4fbf4a', null], ['#3ea85a', '#ff9ac4'], ['#5cc443', null], ['#6bd36b', '#ffd23f']];
  BUSH.forEach((b, i) => definir('arb' + i, () => A.arbusto(b[0], b[1], i * 9 + 3, 1)));
  const ARB = [];
  for (const p of ['verde', 'lima', 'escura', 'maca']) for (const s of [2, 7]) { const nm = 'arv_' + p + '_' + s; definir(nm, () => A.arvore(p, s, 1)); ARB.push(nm); }
  const ESC = A.GUARDIAO_ESCALA || 0.62;
  ['anda1', 'anda2', 'atento'].forEach((pose) => definir('g_' + pose, () => A.guardiao(pose), ESC));

  // entrada de cueva: arte propia del proyecto, con el mismo estilo del motor (volumen + sombra índigo)
  function arteCueva() {
    const a = V.arte();
    a.sombra(2, 3, 46, 15, 0.4, 5);
    // montículo rocoso con volumen
    const roca = V.smooth([[-48, 4], [-44, -26], [-24, -52], [2, -60], [30, -54], [48, -34], [50, -8], [42, 6], [0, 10]], true, 1);
    a.volume(roca, '#8d95a8', { box: [-48, -60, 98, 70], claro: 0.52, escuro: -0.42, rimCor: '#eaf2ff', rimW: 3 });
    // boca oscura de la cueva
    const boca = 'M-22,6C-24,-26 -9,-42 0,-42C9,-42 24,-26 22,6Z';
    a.add(`<path d="${boca}" fill="${a.rg([[0, '#2a2340'], [0.55, '#120d20'], [1, '#030208']], 0.5, 0.72, 0.95)}"/>`);
    // brillo cálido al fondo (invita a entrar)
    a.add(`<ellipse cx="0" cy="2" rx="12" ry="6" fill="${a.rg([[0, '#ffcf7a', 0.5], [1, '#ffcf7a', 0]])}"/>`);
    // borde iluminado del arco
    a.add('<path d="M-22,6C-24,-26 -9,-42 0,-42C9,-42 24,-26 22,6" fill="none" stroke="#c3ccdf" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>');
    // piedras a los lados
    a.add(`<path d="${V.smooth([[-46, 6], [-40, -4], [-30, -6], [-24, 2], [-30, 8]], true, 1)}" fill="${V.sh('#9aa2b4', -0.1)}"/>`);
    a.add(`<path d="${V.smooth([[26, 6], [32, -6], [44, -6], [50, 2], [44, 9]], true, 1)}" fill="${V.sh('#9aa2b4', -0.1)}"/>`);
    return a.out(8);
  }
  definir('cueva', arteCueva);

  /* ============================== lienzo + dimensiones ============================== */
  const cv = document.getElementById('lienzo'), ctx = cv.getContext('2d');
  const Z = 1.6, PAD = 40, MARGEN = 150;   // zoom fijo, borde del personaje, césped alrededor del área
  let W = 0, H = 0, dpr = 1, RS = 0, cw = 0, ch = 0, vw = 0, vh = 0;
  function leerDims() { W = innerWidth; H = innerHeight; dpr = Math.min(window.devicePixelRatio || 1, 2.5); vw = W / Z; vh = H / Z; }
  leerDims();

  /* ============================== áreas + salas ==============================
   * Cada área es una rejilla cols×rows de salas (pantallas) con su escenario propio.
   * cfg.salidas: { 'qx,qy': { a:'<área>', sala:'qx,qy', etiqueta } } = portal desde esa sala.
   * Para un mapa más grande: subí cols/rows. Para un lugar nuevo (pueblo, cueva):
   * agregá otra área a AREAS y una salida que apunte a ella. */
  function crearArea(cfg) {
    const cols = cfg.cols, rows = cfg.rows;
    const spanx = cols * vw + 2 * MARGEN, spany = rows * vh + 2 * MARGEN;
    const centro = (qx, qy) => [MARGEN + (qx + 0.5) * vw, MARGEN + (qy + 0.5) * vh];
    const sem = V.rng(cfg.semilla);
    const objetos = [], manchas = [];
    const coloca = (nombre, sx, sy) => objetos.push({ nombre, sx, sy, d: V.depthPx(sx, sy) });
    const cant = (p) => Math.round((p || 0) * cols * rows);   // densidad por pantalla × nº de pantallas
    const ini = centro(0, 0), lejos = (sx, sy) => Math.hypot(sx - ini[0], sy - ini[1]) > 90;
    const d = cfg.dens || {};
    if (cfg.tipo === 'mazmorra') {
      for (let i = 0; i < cant(d.ped); i++) coloca('pedra' + (i % 6), sem.r(30, spanx - 30), sem.r(30, spany - 30));
      for (let i = 0; i < cant(d.tufo); i++) coloca('tufo' + (i % 6), sem.r(10, spanx - 10), sem.r(10, spany - 10));
    } else {   // campo (hierba, flores, rocas, arbustos, árboles)
      for (let i = 0; i < cant(d.arv); i++) { const sx = sem.r(70, spanx - 70), sy = sem.r(70, spany - 70); if (lejos(sx, sy)) coloca(sem.pick(ARB), sx, sy); }
      for (let i = 0; i < cant(d.arb); i++) coloca('arb' + (i % 4), sem.r(50, spanx - 50), sem.r(50, spany - 50));
      for (let i = 0; i < cant(d.ped); i++) coloca('pedra' + (i % 6), sem.r(30, spanx - 30), sem.r(30, spany - 30));
      for (let i = 0; i < cant(d.flor); i++) coloca('flor' + (i % 6), sem.r(10, spanx - 10), sem.r(10, spany - 10));
      for (let i = 0; i < cant(d.tufo); i++) coloca('tufo' + (i % 6), sem.r(10, spanx - 10), sem.r(10, spany - 10));
    }
    const paleta = cfg.manchas || ['#5fb23e', '#3f8a2c', '#6fc24e', '#58a838'];
    for (let i = 0; i < cant(d.mancha || 10); i++) manchas.push({ sx: sem.r(-60, spanx + 60), sy: sem.r(-60, spany + 60), rx: sem.r(22, 50), cor: sem.pick(paleta) });
    return { nombre: cfg.nombre, cols, rows, spanx, spany, centro, objetos, manchas, suelo: cfg.suelo, salidas: cfg.salidas || {} };
  }

  // anclas para colocar puertas/portales dentro de una pantalla: mitad de la diagonal hacia cada esquina.
  // en una salida: `desp: 'sup-der'` (o un par [fx, fy] en fracción de pantalla). Sin desp = centro.
  const ANCLAS = {
    centro: [0, 0],
    'sup-izq': [-0.25, -0.25], 'sup-der': [0.25, -0.25],
    'inf-izq': [-0.25, 0.25], 'inf-der': [0.25, 0.25],
  };

  const AREAS = {
    campo: crearArea({
      nombre: 'Campo', tipo: 'campo', cols: 2, rows: 2, semilla: 1,
      suelo: ['#79c457', '#3f8a2c'], dens: { arv: 10, arb: 8, ped: 10, flor: 38, tufo: 65, mancha: 28 },
      salidas: { '1,0': { a: 'cueva', sala: '0,0', etiqueta: '⛏ Entrar a la cueva', desp: 'sup-der' } },
    }),
    cueva: crearArea({
      nombre: 'Cueva', tipo: 'mazmorra', cols: 2, rows: 1, semilla: 77,
      suelo: ['#6b6472', '#2a2533'], manchas: ['#4f4a59', '#39343f', '#5a5565'], dens: { ped: 18, tufo: 6, mancha: 16 },
      salidas: { '0,0': { a: 'campo', sala: '1,0', etiqueta: '↩ Salir de la cueva', desp: 'sup-izq' } },
    }),
  };

  // toda salida se VE como una cueva centrada en su sala (entrada en el campo y salida dentro de la cueva);
  // se usa tocándola o con el botón
  Object.keys(AREAS).forEach((k) => {
    const area = AREAS[k];
    for (const sid in area.salidas) {
      const sal = area.salidas[sid];
      const p = sid.split(',').map(Number), c = area.centro(p[0], p[1]);
      const d = (typeof sal.desp === 'string' ? ANCLAS[sal.desp] : sal.desp) || [0, 0];
      const sx = c[0] + d[0] * vw, sy = c[1] + d[1] * vh - 8;   // desp mueve la puerta dentro de su pantalla
      area.objetos.push({ nombre: 'cueva', sx, sy, d: V.depthPx(sx, sy) });
      sal.obj = { sx, sy };
    }
  });

  // estado activo: qué área y qué sala
  const actual = { area: AREAS.campo, qx: 0, qy: 0 };
  const salidaActual = () => actual.area.salidas[actual.qx + ',' + actual.qy] || null;

  /* ============================== cámara + personaje ============================== */
  const ini0 = actual.area.centro(0, 0);
  const cam = { x: ini0[0], y: ini0[1], z: Z, tween: null };
  const heroi = { x: ini0[0], y: ini0[1], ax: null, ay: null, mirando: 1, andando: false };
  const VEL = 190;
  let trans = null, fade = 0, listo = false;   // trans = transición de portal; fade = 0..1 (negro)

  const DX = (wx) => (wx - cam.x) * cam.z * dpr + cw / 2;
  const DY = (wy) => (wy - cam.y) * cam.z * dpr + ch / 2;
  const mundo = (sx, sy) => [(sx - W / 2) / cam.z + cam.x, (sy - H / 2) / cam.z + cam.y];

  function redimensionar() {
    leerDims();
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cv.width = cw = Math.round(W * dpr); cv.height = ch = Math.round(H * dpr);
    cam.z = Z;
    const nr = Math.round(Z * dpr * 100) / 100;
    if (nr !== RS) { RS = nr; if (listo) prepararTodos(RS); }
    const c = actual.area.centro(actual.qx, actual.qy); cam.x = c[0]; cam.y = c[1]; cam.tween = null;
  }
  window.addEventListener('resize', redimensionar);

  cv.addEventListener('pointerdown', (e) => {
    if (cam.tween || trans) return;   // en transición no se camina
    const r = cv.getBoundingClientRect();
    const w = mundo(e.clientX - r.left, e.clientY - r.top);
    // ¿tocaste la puerta de la cueva de esta sala? entonces entra
    const sal = salidaActual();
    if (sal && sal.obj) {
      const b = sprites[sal.sprite || 'cueva'].bb;
      if (w[0] >= sal.obj.sx + b.x && w[0] <= sal.obj.sx + b.x + b.w && w[1] >= sal.obj.sy + b.y && w[1] <= sal.obj.sy + b.y + b.h) { irPortal(); return; }
    }
    heroi.ax = V.clamp(w[0], PAD, actual.area.spanx - PAD);
    heroi.ay = V.clamp(w[1], PAD, actual.area.spany - PAD);
  });

  /* ============================== controles (bordes + portal + minimapa) ============================== */
  const bot = { arriba: document.getElementById('b-arriba'), abajo: document.getElementById('b-abajo'), izq: document.getElementById('b-izq'), der: document.getElementById('b-der') };
  const miniEl = document.getElementById('mini'), sub = document.getElementById('sub');

  function montarMinimapa() {
    const a = actual.area;
    miniEl.style.gridTemplateColumns = 'repeat(' + a.cols + ', 1fr)';
    miniEl.innerHTML = '';
    for (let i = 0; i < a.cols * a.rows; i++) miniEl.appendChild(document.createElement('i'));
  }

  // moverse a una sala vecina DENTRO del área actual (pan)
  function irA(qx, qy) {
    const a = actual.area;
    if (trans || cam.tween || qx < 0 || qx >= a.cols || qy < 0 || qy >= a.rows) return;
    actual.qx = qx; actual.qy = qy;
    const c = a.centro(qx, qy);
    cam.tween = { x0: cam.x, y0: cam.y, x1: c[0], y1: c[1], t0: performance.now(), ms: 560 };
    heroi.ax = heroi.ay = null;   // el personaje viaja con el mapa al centro de la nueva pantalla
    actualizarBotones();
  }

  // entrar/salir por un portal: fundido a negro, cambio de área y aparición en la sala destino
  function irPortal() {
    const sal = salidaActual();
    if (!sal || trans || cam.tween) return;
    trans = { t0: performance.now(), ms: 520, sal, hecho: false };
    heroi.ax = heroi.ay = null;
    actualizarBotones();
  }
  function aplicarPortal(sal) {
    actual.area = AREAS[sal.a];
    const p = sal.sala.split(',').map(Number);
    actual.qx = p[0]; actual.qy = p[1];
    const c = actual.area.centro(actual.qx, actual.qy);
    cam.x = c[0]; cam.y = c[1]; cam.tween = null;
    heroi.x = c[0]; heroi.y = c[1]; heroi.ax = heroi.ay = null;
    montarMinimapa();
  }

  function actualizarBotones() {
    const a = actual.area, bloq = !!trans;
    bot.izq.hidden = bloq || actual.qx === 0;
    bot.der.hidden = bloq || actual.qx === a.cols - 1;
    bot.arriba.hidden = bloq || actual.qy === 0;
    bot.abajo.hidden = bloq || actual.qy === a.rows - 1;
    const idx = actual.qy * a.cols + actual.qx;
    for (let i = 0; i < miniEl.children.length; i++) miniEl.children[i].className = i === idx ? 'on' : '';
    sub.textContent = a.nombre + ' · ' + a.cols + '×' + a.rows + ' · clic para caminar';
  }
  bot.izq.onclick = () => irA(actual.qx - 1, actual.qy);
  bot.der.onclick = () => irA(actual.qx + 1, actual.qy);
  bot.arriba.onclick = () => irA(actual.qx, actual.qy - 1);
  bot.abajo.onclick = () => irA(actual.qx, actual.qy + 1);

  /* ============================== dibujo ============================== */
  function sprite(nombre, wx, wy, bobY, flip) {
    const sp = sprites[nombre], bmp = bmps[nombre]; if (!sp || !bmp || !bmp.width) return;
    const s = RS, X = DX(wx), Y = DY(wy) + (bobY || 0) * s;
    const ox = sp.bb.x * s, oy = sp.bb.y * s, w = sp.bb.w * s, h = sp.bb.h * s;
    if (X + ox > cw || X + ox + w < 0 || Y + oy > ch || Y + oy + h < 0) return;
    if (flip) { ctx.save(); ctx.translate(X, Y); ctx.scale(-1, 1); ctx.drawImage(bmp, ox, oy, w, h); ctx.restore(); }
    else ctx.drawImage(bmp, X + ox, Y + oy, w, h);
  }
  function suelo() {
    const a = actual.area;
    const g = ctx.createRadialGradient(cw / 2, ch * 0.42, 10, cw / 2, ch * 0.42, Math.max(cw, ch) * 0.75);
    g.addColorStop(0, a.suelo[0]); g.addColorStop(1, a.suelo[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);
    const s = RS; ctx.globalAlpha = 0.5;
    for (const m of a.manchas) {
      const X = DX(m.sx), Y = DY(m.sy);
      if (X < -80 || X > cw + 80 || Y < -80 || Y > ch + 80) continue;
      ctx.fillStyle = m.cor; ctx.beginPath(); ctx.ellipse(X, Y, m.rx * s, m.rx * 0.5 * s, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  let ultimo = 0;
  function cuadro(ts) {
    const dt = Math.min(0.05, (ts - ultimo) / 1000 || 0); ultimo = ts;

    if (trans) {
      // fundido a negro: oscurece, a mitad cambia de área, aclara
      const k = V.clamp((ts - trans.t0) / trans.ms, 0, 1);
      if (k < 0.5) fade = k / 0.5;
      else { if (!trans.hecho) { aplicarPortal(trans.sal); trans.hecho = true; } fade = 1 - (k - 0.5) / 0.5; }
      if (k >= 1) { fade = 0; trans = null; actualizarBotones(); }
    } else if (cam.tween) {
      const tw = cam.tween, k = V.clamp((ts - tw.t0) / tw.ms, 0, 1), e = ease(k);
      cam.x = tw.x0 + (tw.x1 - tw.x0) * e; cam.y = tw.y0 + (tw.y1 - tw.y0) * e;
      if (k >= 1) cam.tween = null;
    }

    heroi.andando = false;
    if (!trans && !cam.tween && heroi.ax != null) {
      const dx = heroi.ax - heroi.x, dy = heroi.ay - heroi.y, dist = Math.hypot(dx, dy);
      if (dist < 2) { heroi.ax = heroi.ay = null; }
      else {
        const paso = Math.min(dist, VEL * dt);
        heroi.x += (dx / dist) * paso; heroi.y += (dy / dist) * paso;
        heroi.andando = true;
        if (Math.abs(dx) > 0.5) heroi.mirando = dx < 0 ? -1 : 1;
      }
    }
    if (cam.tween) { heroi.x = cam.x; heroi.y = cam.y; }   // viaja con el mapa en el pan

    suelo();
    const lista = actual.area.objetos.slice();
    lista.push({ heroi: true, d: V.depthPx(heroi.x, heroi.y) });
    lista.sort((a, b) => a.d - b.d);
    const bob = heroi.andando ? -Math.abs(Math.sin(ts / 110)) * 2 : 0;
    const pose = heroi.andando ? (Math.floor(ts / 170) % 2 ? 'anda1' : 'anda2') : 'atento';
    for (const o of lista) {
      if (o.heroi) sprite('g_' + pose, heroi.x, heroi.y, bob, heroi.mirando < 0);
      else sprite(o.nombre, o.sx, o.sy);
    }
    if (fade > 0) { ctx.fillStyle = 'rgba(0,0,0,' + fade + ')'; ctx.fillRect(0, 0, cw, ch); }

    requestAnimationFrame(cuadro);
  }

  /* ============================== arranque ============================== */
  redimensionar();
  montarMinimapa();
  actualizarBotones();
  prepararTodos(RS).then(() => { listo = true; aviso.remove(); requestAnimationFrame(cuadro); });
})();
</script>
</body>
